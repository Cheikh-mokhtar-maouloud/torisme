worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Journal au format JSON, comme les applications. Un agrégateur reçoit alors
  # une seule forme d'événement, sans expression régulière propre à Nginx.
  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration":$request_time,"upstream":"$upstream_addr"}';

  access_log /var/log/nginx/access.log json;
  error_log  /var/log/nginx/error.log warn;

  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;

  # La version exacte de Nginx n'apprend rien à un utilisateur légitime, et
  # renseigne un attaquant sur les failles applicables.
  server_tokens off;

  gzip on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;
  gzip_min_length 1024;

  # Plafond global. Les téléversements sont bornés à 4 Mo côté application ; ce
  # plafond arrête le corps **avant** qu'il n'atteigne Node, de sorte qu'un envoi
  # de 2 Go est refusé par Nginx sans consommer une once de mémoire applicative.
  client_max_body_size 8m;
  client_body_timeout 30s;
  client_header_timeout 15s;

  # Limitation de débit de bordure. Elle ne remplace pas celle de l'application,
  # qui compte par compte et connaît les rôles : celle-ci travaille sur l'adresse
  # IP et sert à absorber ce qui ne doit jamais atteindre Node — une inondation
  # arrêtée ici ne consomme ni connexion MongoDB ni cycle applicatif.
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=connections:10m;

  # 429 plutôt que le 503 par défaut. « Service indisponible » désigne une panne
  # du serveur ; ici c'est le client qui dépasse son quota, et la distinction
  # compte : un client bien écrit réessaie après un 503, alors qu'un 429 lui dit
  # de ralentir.
  limit_req_status 429;
  limit_conn_status 429;

  # Résolveur interne de Docker, déclaré une seule fois pour tout le serveur.
  #
  # Il sert deux usages qu'il ne faut pas séparer.
  #
  # 1. Les `proxy_pass` passent par une **variable**, ce qui diffère la
  #    résolution du nom au moment de la requête. Écrire `proxy_pass
  #    http://backend` la ferait au chargement : un conteneur momentanément
  #    absent — premier démarrage, redéploiement, boucle de redémarrage — ferait
  #    alors refuser à Nginx de démarrer *entièrement*. Une panne d'un service
  #    en provoquerait trois. Avec une variable, elle se traduit par un 502 sur
  #    le domaine concerné, et rien d'autre.
  # 2. L'agrafage OCSP, qui interroge l'autorité de certification.
  #
  # Le résolveur de Docker sait faire les deux : il connaît les noms de services
  # et transmet le reste aux DNS de l'hôte. Déclarer un résolveur public dans un
  # bloc `server` — pour l'OCSP, par exemple — l'y rendrait prioritaire, et
  # « backend » n'y serait plus résoluble : un 502 permanent, dont la cause est
  # invisible dans la configuration de l'hôte virtuel concerné.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # Nécessaire à la mise à niveau WebSocket : renvoie « upgrade » quand le client
  # le demande, et une chaîne vide sinon. Écrire `Connection "upgrade"` en dur
  # casserait les requêtes HTTP ordinaires vers le même service.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # --- Redirection HTTP ------------------------------------------------------
  server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Le renouvellement Let's Encrypt doit rester joignable en clair : rediriger
    # aussi ce chemin ferait échouer chaque renouvellement, et le certificat
    # expirerait au bout de trois mois sans que personne n'ait rien changé.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # --- API -------------------------------------------------------------------
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${API_DOMAIN};

    ssl_certificate     /etc/nginx/certs/api/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/api/privkey.pem;

    include /etc/nginx/conf.d/tls.inc;

    limit_conn connections 50;

    # Le refus est rendu en **JSON**, comme toute réponse de cette API.
    #
    # Par défaut Nginx sert une page HTML : un client qui analyse la réponse
    # tombe alors sur « <html> » au lieu du format annoncé, et échoue sur une
    # erreur d'analyse au lieu de comprendre qu'il doit ralentir. Le code
    # d'erreur reprend celui de l'application, pour que le client n'ait qu'un
    # seul cas à traiter.
    error_page 429 = @trop_de_requetes;
    error_page 502 503 504 = @indisponible;

    location @trop_de_requetes {
      default_type application/json;
      add_header Retry-After 10 always;
      return 429 '{"success":false,"error":{"code":"RATE_LIMITED","message":"Trop de requêtes. Réessayez dans un instant."}}';
    }

    location @indisponible {
      default_type application/json;
      return 503 '{"success":false,"error":{"code":"INTERNAL_ERROR","message":"Service temporairement indisponible"}}';
    }

    # Barème strict sur l'authentification : c'est la cible des attaques par
    # force brute et par énumération. `burst` avec `nodelay` laisse passer une
    # rafale courte — un formulaire renvoyé deux fois — sans autoriser un débit
    # soutenu.
    location ~ ^/api/auth/(login|register|forgot-password|reset-password) {
      limit_req zone=auth burst=5 nodelay;
      # Résolution à la requête : voir le bloc `resolver` plus haut.
      set $upstream_backend backend:3000;
      proxy_pass http://$upstream_backend;
      include /etc/nginx/conf.d/proxy.inc;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # Les routes internes ne sont **pas** exposées. Le worker s'adresse au
    # backend par le réseau interne de Docker, sans passer par Nginx. Les publier
    # ne servirait à personne et offrirait une cible supplémentaire, même
    # protégée par un secret.
    location /api/internal/ {
      return 404;
    }

    location / {
      limit_req zone=api burst=60 nodelay;
      # Résolution à la requête : voir le bloc `resolver` plus haut.
      set $upstream_backend backend:3000;
      proxy_pass http://$upstream_backend;
      include /etc/nginx/conf.d/proxy.inc;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }
  }

  # --- Dashboard -------------------------------------------------------------
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DASHBOARD_DOMAIN};

    ssl_certificate     /etc/nginx/certs/dashboard/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/dashboard/privkey.pem;

    include /etc/nginx/conf.d/tls.inc;

    limit_conn connections 50;

    location / {
      limit_req zone=api burst=60 nodelay;
      # Résolution à la requête : voir le bloc `resolver` plus haut.
      set $upstream_dashboard dashboard:3000;
      proxy_pass http://$upstream_dashboard;
      include /etc/nginx/conf.d/proxy.inc;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # Aucun en-tête de sécurité n'est ajouté ici : le dashboard émet sa propre
    # CSP, construite autour d'un nonce régénéré à chaque réponse (Phase 14).
    # Nginx ne peut pas produire ce nonce, et un `add_header` de sa part
    # **remplacerait** celui de l'application — donc casserait la page.
  }

  # --- Temps réel ------------------------------------------------------------
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${REALTIME_DOMAIN};

    ssl_certificate     /etc/nginx/certs/realtime/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/realtime/privkey.pem;

    include /etc/nginx/conf.d/tls.inc;

    location / {
      # Résolution à la requête : voir le bloc `resolver` plus haut.
      set $upstream_realtime realtime:4100;
      proxy_pass http://$upstream_realtime;
      include /etc/nginx/conf.d/proxy.inc;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Une connexion Socket.IO reste ouverte sans échanger pendant de longues
      # périodes. Le délai par défaut de 60 s la couperait régulièrement, et le
      # client se reconnecterait en boucle — un symptôme facile à confondre avec
      # une instabilité réseau.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
